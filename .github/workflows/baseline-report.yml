name: Baseline report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  report:
    name: Report code scanning alert counts
    runs-on: ubuntu-latest
    steps:
      - name: Query code scanning alerts via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Querying code scanning alerts (GITHUB_TOKEN with security-events:read)..."
          alerts=$(gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=all&per_page=100")
          total=$(echo "$alerts" | jq 'length')
          open=$(echo "$alerts" | jq '[.[] | select(.state == "open")] | length')
          closed=$(echo "$alerts" | jq '[.[] | select(.state != "open")] | length')
          echo "Total code scanning alerts (all states): ${total}"
          echo "Open code scanning alerts: ${open}"
          echo "Closed/fixed/dismissed code scanning alerts: ${closed}"
          {
            echo "## Code scanning baseline"
            echo ""
            echo "- Total alerts (all states): ${total}"
            echo "- Open alerts: ${open}"
            echo "- Closed/fixed/dismissed alerts: ${closed}"
          } >> "$GITHUB_STEP_SUMMARY"
